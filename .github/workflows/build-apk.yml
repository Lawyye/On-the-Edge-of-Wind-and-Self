# Собирает APK на серверах GitHub, чтобы для проверки приложения не нужно было
# ставить Flutter и Android SDK на свой компьютер.
#
# Готовый файл выкладывается в релиз «apk» — там у каждого APK прямая ссылка,
# которую можно открыть на телефоне и сразу установить.
#
# Запускается кнопкой (Run workflow) и сам при изменениях в app/.

name: Сборка APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Версия закреплена: та же, на которой код проверен локально. Новый
      # Flutter может объявить устаревшим то, на чём стоит приложение.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      # Платформенных папок в репозитории нет — они восстанавливаются прямо здесь.
      # В существующей папке create дописывает только недостающее и не трогает
      # lib/, test/, pubspec.yaml и assets/.
      - name: Восстановить платформенные папки
        working-directory: app
        run: flutter create --org com.ontheedge --project-name edgewind --platforms android,ios .

      # flutter create кладёт заготовку теста под класс MyApp, которого в этом
      # приложении нет. Она ничего не проверяет и только мешает.
      - name: Убрать заготовку теста
        working-directory: app
        run: rm -f test/widget_test.dart

      # flutter create кладёт разрешение на интернет только в отладочный
      # манифест. В релизной сборке его нет, и приложение не может открыть
      # ни одного соединения — что и случилось с первой выложенной сборкой.
      # Запрос на звонилку нужен, чтобы кнопка «Позвонить 150» открывала набор.
      - name: Дописать манифест
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="edgewind"/android:label="On the Edge"/' "$M"
          grep -q 'android.permission.INTERNET' "$M" || sed -i \
            's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          if ! grep -q 'android.intent.action.DIAL' "$M"; then
            DIAL='<intent>\n            <action android:name="android.intent.action.DIAL"/>\n            <data android:scheme="tel"/>\n        </intent>'
            if grep -q '<queries>' "$M"; then
              sed -i "0,/<queries>/s|<queries>|<queries>\n        $DIAL|" "$M"
            else
              sed -i "s|</manifest>|    <queries>\n        $DIAL\n    </queries>\n</manifest>|" "$M"
            fi
          fi
          echo '--- манифест ---'
          grep -E 'uses-permission|android:label|DIAL' "$M"

      # Отдельной проверкой, потому что без интернета приложение собирается
      # и ставится как ни в чём не бывало, а падает уже у человека на экране.
      - name: Убедиться, что интернет разрешён
        working-directory: app
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml \
            || { echo '::error::В основном манифесте нет разрешения INTERNET'; exit 1; }

      # Android ставит новую версию поверх старой, только если обе подписаны
      # одним ключом. Без постоянного ключа каждая сборка подписывалась новым
      # случайным — и обновление требовало удалить приложение, а вместе с ним
      # и анонимный аккаунт. Ключ лежит в секрете репозитория и кладётся туда,
      # откуда его берёт подпись по умолчанию.
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Подпись постоянным ключом."
          else
            echo "::warning::Секрета ANDROID_KEYSTORE_B64 нет — APK подписан временным ключом и поверх прежней версии не встанет."
          fi

      - name: Зависимости
        working-directory: app
        run: flutter pub get

      - name: Иконка
        working-directory: app
        run: dart run flutter_launcher_icons

      # Анализатор не валит сборку: замечания к стилю не повод не получить APK.
      - name: Проверка кода
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      # Тесты нажимают кнопки за человека и проверяют вёрстку на маленьком
      # экране. Снимки экранов (метка golden) сравниваются только локально.
      - name: Тесты
        working-directory: app
        run: flutter test --exclude-tags golden

      - name: Релизная сборка
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Отпечаток подписи
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs app-arm64-v8a-release.apk | grep -i 'SHA-256' | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: edgewind-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Выложить APK отдельной ссылкой
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          cat > notes.md <<'EOF'
          Для почти всех современных телефонов нужен **app-arm64-v8a-release.apk**.
          Второй файл — для старых 32-битных.

          Android спросит разрешение поставить приложение из неизвестного
          источника: так он реагирует на любой APK не из Play Market.
          EOF
          sed -i 's/^          //' notes.md
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk \
            app-arm64-v8a-release.apk \
            app-armeabi-v7a-release.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "On the Edge — свежая сборка" \
            --notes-file notes.md
          echo "Ссылка: $(gh release view apk --json url --jq .url)"
