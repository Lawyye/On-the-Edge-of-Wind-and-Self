# Собирает APK на серверах GitHub, чтобы для проверки приложения не нужно было
# ставить Flutter и Android SDK на свой компьютер.
#
# Как получить файл:
#   вкладка Actions → запуск «Сборка APK» → раздел Artifacts внизу →
#   скачать edgewind-apk. Внутри архива нужен app-arm64-v8a-release.apk —
#   он подходит почти всем современным телефонам.
#
# Запускается кнопкой (Run workflow) и сам при изменениях в app/.

name: Сборка APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Платформенных папок в репозитории нет — они восстанавливаются прямо здесь.
      # В существующей папке create дописывает только недостающее и не трогает
      # lib/, pubspec.yaml и assets/.
      - name: Восстановить платформенные папки
        working-directory: app
        run: flutter create --org com.ontheedge --project-name edgewind --platforms android,ios .

      # flutter create кладёт заготовку теста под класс MyApp, которого в этом
      # приложении нет. Она ничего не проверяет и только мешает анализатору.
      - name: Убрать заготовку теста
        working-directory: app
        run: rm -f test/widget_test.dart

      - name: Название на экране телефона
        working-directory: app
        run: |
          sed -i 's/android:label="edgewind"/android:label="On the Edge"/' \
            android/app/src/main/AndroidManifest.xml
          grep -o 'android:label="[^"]*"' android/app/src/main/AndroidManifest.xml

      - name: Зависимости
        working-directory: app
        run: flutter pub get

      - name: Иконка
        working-directory: app
        run: dart run flutter_launcher_icons

      # Анализатор не валит сборку: замечания к стилю не повод не получить APK.
      # Но его вывод важен — он единственное место, где видно замечания к коду.
      - name: Проверка кода
        working-directory: app
        continue-on-error: true
        run: flutter analyze

      - name: Релизная сборка
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: edgewind-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
