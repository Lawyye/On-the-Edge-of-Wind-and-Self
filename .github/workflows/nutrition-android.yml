# Сборка и проверка Android-приложения «Рацион» (nutrition-tracker/).
#
# 1. Юнит-тесты расчётов (:core), сетевых клиентов (:remote) и слоя данных (:app, Robolectric).
# 2. Release APK, подписанный постоянным ключом из секрета ANDROID_KEYSTORE_B64.
# 3. Запуск на эмуляторе: инструментальные тесты, установка release, старт приложения,
#    обновление поверх с проверкой сохранности данных.
# 4. Публикация APK в релиз nutrition-apk (прямая ссылка для установки с телефона).
name: Nutrition Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ccr-75be79e5-6nopc2]
    paths:
      - 'nutrition-tracker/**'
      - '.github/workflows/nutrition-android.yml'

permissions:
  contents: write

concurrency:
  group: nutrition-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nutrition-tracker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Отдельный release-ключ приложения: секреты NT_RELEASE_KEYSTORE_B64,
      # NT_RELEASE_KEYSTORE_PASSWORD, NT_RELEASE_KEY_ALIAS, NT_RELEASE_KEY_PASSWORD.
      # Пока их нет, используется общий ключ ANDROID_KEYSTORE_B64 со стандартным паролем.
      - name: Ключ подписи
        env:
          OWN_B64: ${{ secrets.NT_RELEASE_KEYSTORE_B64 }}
          OWN_STORE_PASSWORD: ${{ secrets.NT_RELEASE_KEYSTORE_PASSWORD }}
          OWN_ALIAS: ${{ secrets.NT_RELEASE_KEY_ALIAS }}
          OWN_KEY_PASSWORD: ${{ secrets.NT_RELEASE_KEY_PASSWORD }}
          SHARED_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$OWN_B64" ] && [ -n "$OWN_STORE_PASSWORD" ] && [ -n "$OWN_ALIAS" ]; then
            echo "$OWN_B64" | base64 -d > "$RUNNER_TEMP/nt-release.keystore"
            {
              echo "NT_KEYSTORE_FILE=$RUNNER_TEMP/nt-release.keystore"
              echo "NT_KEYSTORE_PASSWORD=$OWN_STORE_PASSWORD"
              echo "NT_KEY_ALIAS=$OWN_ALIAS"
              echo "NT_KEY_PASSWORD=${OWN_KEY_PASSWORD:-$OWN_STORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Подпись отдельным release-ключом приложения."
          elif [ -n "$SHARED_B64" ]; then
            echo "$SHARED_B64" | base64 -d > "$RUNNER_TEMP/nt-release.keystore"
            {
              echo "NT_KEYSTORE_FILE=$RUNNER_TEMP/nt-release.keystore"
              echo "NT_KEYSTORE_PASSWORD=android"
              echo "NT_KEY_ALIAS=androiddebugkey"
              echo "NT_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "::warning::Подпись общим ключом ANDROID_KEYSTORE_B64 со стандартным паролем. Заведите отдельный ключ (см. README, раздел «Подпись release»)."
          else
            echo "::warning::Ключа подписи нет — release подписан временным ключом и поверх прежней версии не встанет."
          fi

      - name: Тесты расчётов и сетевых клиентов
        run: ./gradlew --no-daemon --stacktrace :core:test :remote:test

      - name: Тесты слоя данных (Robolectric)
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/unit.log"; exit ${PIPESTATUS[0]}

      - name: Сборка APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/build.log"; exit ${PIPESTATUS[0]}

      - name: Ошибки компиляции (сводка)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/unit.log "$RUNNER_TEMP"/build.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            grep -E '^e: |error:|ERROR:|What went wrong|FAILED|Exception:' "$f" | head -150 || true
          done
          for r in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$r" ] || continue
            grep -A3 '<failure' "$r" | head -40 || true
          done

      - name: Схема базы данных
        if: always()
        run: |
          for f in app/schemas/*/*.json; do [ -f "$f" ] && { echo "===== $f"; cat "$f"; }; done || true

      - name: Подпись и размер
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la app/build/outputs/apk/*/
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | grep -iE 'SHA-256|Signer #1 certificate DN' | head -2

      - uses: actions/upload-artifact@v4
        with:
          name: nutrition-apks
          path: |
            nutrition-tracker/app/build/outputs/apk/release/app-release.apk
            nutrition-tracker/app/build/outputs/apk/debug/app-debug.apk
            nutrition-tracker/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: nutrition-apks
          path: apks

      - name: KVM для эмулятора
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          find apks -name '*.apk' -exec ls -la {} \;

      - name: Проверка на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash nutrition-tracker/ci/emulator-check.sh "$GITHUB_WORKSPACE/apks" "$RUNNER_TEMP/shots"

      - name: Снимки экранов
        if: always()
        working-directory: .
        run: |
          for f in "$RUNNER_TEMP"/shots/*.png; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if command -v convert >/dev/null; then convert "$f" -resize 50% "$f"; fi
            echo "=====BEGIN $name"; base64 -w 100 "$f"; echo "=====END $name"
          done

  publish:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nutrition-apks
          path: apks

      - name: Выложить APK отдельной ссылкой
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apks/release/app-release.apk racion-release.apk
          cat > notes.md <<'NOTES'
          Рацион — личный трекер питания. Release-сборка, проверенная в CI:
          юнит-тесты расчётов, тесты базы данных, онбординг на эмуляторе,
          переустановка поверх с сохранением данных, запуск release и случайные нажатия.

          Android спросит разрешение на установку из неизвестного источника —
          так он реагирует на любой APK не из Play Market. Обновления ставятся
          поверх, данные сохраняются (подпись постоянным ключом).
          NOTES
          sed -i 's/^          //' notes.md
          gh release delete nutrition-apk --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nutrition-apk racion-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Рацион — свежая сборка" \
            --notes-file notes.md
          echo "Ссылка: $(gh release view nutrition-apk --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
