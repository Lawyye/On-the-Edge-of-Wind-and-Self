# Сборка и проверка Android-приложения «Рацион» (nutrition-tracker/).
#
# 1. Юнит-тесты расчётов (:core), сетевых клиентов (:remote) и слоя данных (:app, Robolectric).
# 2. Release APK, подписанный постоянным ключом из секрета ANDROID_KEYSTORE_B64.
# 3. Запуск на эмуляторе: инструментальные тесты, установка release, старт приложения,
#    обновление поверх с проверкой сохранности данных.
# 4. Публикация APK в релиз nutrition-apk (прямая ссылка для установки с телефона).
name: Nutrition Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ccr-75be79e5-6nopc2]
    paths:
      - 'nutrition-tracker/**'
      - '.github/workflows/nutrition-android.yml'

permissions:
  contents: write

concurrency:
  group: nutrition-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nutrition-tracker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nt-release.keystore"
            {
              echo "NT_KEYSTORE_FILE=$RUNNER_TEMP/nt-release.keystore"
              echo "NT_KEYSTORE_PASSWORD=android"
              echo "NT_KEY_ALIAS=androiddebugkey"
              echo "NT_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "Подпись постоянным ключом."
          else
            echo "::warning::Секрета ANDROID_KEYSTORE_B64 нет — release подписан временным ключом."
          fi

      - name: Тесты расчётов и сетевых клиентов
        run: ./gradlew --no-daemon --stacktrace :core:test :remote:test

      - name: Тесты слоя данных (Robolectric)
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/unit.log"; exit ${PIPESTATUS[0]}

      - name: Сборка APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/build.log"; exit ${PIPESTATUS[0]}

      - name: Ошибки компиляции (сводка)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/unit.log "$RUNNER_TEMP"/build.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            grep -E '^e: |error:|ERROR:|What went wrong|FAILED|Exception:' "$f" | head -150 || true
          done
          for r in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$r" ] || continue
            grep -A3 '<failure' "$r" | head -40 || true
          done

      - name: Схема базы данных
        if: always()
        run: |
          for f in app/schemas/*/*.json; do [ -f "$f" ] && { echo "===== $f"; cat "$f"; }; done || true

      - name: Подпись и размер
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la app/build/outputs/apk/*/
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | grep -iE 'SHA-256|Signer #1 certificate DN' | head -2

      - uses: actions/upload-artifact@v4
        with:
          name: nutrition-apks
          path: |
            nutrition-tracker/app/build/outputs/apk/release/app-release.apk
            nutrition-tracker/app/build/outputs/apk/debug/app-debug.apk
            nutrition-tracker/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
