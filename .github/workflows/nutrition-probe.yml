# Разовая разведка для Nutrition Tracker: какие версии Google-библиотек сейчас
# стабильны и как на самом деле выглядят ответы USDA и Open Food Facts.
# Среда разработки не видит dl.google.com и эти API, а раннер GitHub видит.
name: Nutrition probe

on:
  workflow_dispatch:
  push:
    branches: [ccr-75be79e5-6nopc2]
    paths:
      - '.github/workflows/nutrition-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Google Maven versions
        run: |
          meta() {
            curl -sL "https://dl.google.com/dl/android/maven2/$1/maven-metadata.xml" \
              | grep -oE '<version>[^<]+' | sed 's/<version>//' \
              | grep -viE 'alpha|beta|rc|dev' | tail -4 | tr '\n' ' '
            echo " <= $1"
          }
          for a in \
            com/android/tools/build/gradle \
            androidx/compose/compose-bom \
            androidx/compose/material/material-icons-extended \
            androidx/activity/activity-compose \
            androidx/core/core-ktx \
            androidx/core/core-splashscreen \
            androidx/lifecycle/lifecycle-runtime-compose \
            androidx/lifecycle/lifecycle-viewmodel-compose \
            androidx/navigation/navigation-compose \
            androidx/room/room-runtime \
            androidx/datastore/datastore-preferences \
            androidx/work/work-runtime-ktx \
            androidx/test/ext/junit \
            androidx/test/runner \
            androidx/test/core \
            androidx/test/espresso/espresso-core \
            androidx/test/uiautomator/uiautomator \
            androidx/profileinstaller/profileinstaller \
            com/google/android/material/material ; do meta $a; done

      - name: AGP and BOM details
        run: |
          AGP=$(curl -sL https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -viE 'alpha|beta|rc|dev' | tail -1)
          echo "AGP=$AGP"
          curl -sL "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/$AGP/gradle-$AGP.pom" | grep -B2 -A3 -E 'kotlin-gradle-plugin|kotlin-stdlib' | head -30
          BOM=$(curl -sL https://dl.google.com/dl/android/maven2/androidx/compose/compose-bom/maven-metadata.xml | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -viE 'alpha|beta|rc|dev' | tail -1)
          echo "BOM=$BOM"
          curl -sL "https://dl.google.com/dl/android/maven2/androidx/compose/compose-bom/$BOM/compose-bom-$BOM.pom" \
            | grep -A1 -E '<artifactId>(material3|material-icons-extended|material-icons-core|ui|ui-test-junit4|foundation|animation)</artifactId>' | grep -oE '<(artifactId|version)>[^<]+' | paste - -
          echo "--- sdk platforms on runner ---"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: USDA SR Legacy and portions
        run: |
          K=DEMO_KEY
          B=https://api.nal.usda.gov/fdc/v1
          curl -s "$B/food/171688?api_key=$K" | jq . > usda2_food_sr_apple.json
          curl -s "$B/foods/search?api_key=$K&query=apple%20raw&dataType=Foundation,SR%20Legacy&pageSize=3" | jq '{totalHits, foods: [.foods[] | {fdcId, dataType, description, foodCategory, foodMeasures}]}' > usda2_search_apple_generic.json
          curl -s "$B/foods/search?api_key=$K&query=egg%20whole%20raw&dataType=SR%20Legacy&pageSize=1" | jq . > usda2_search_egg_sr.json
          curl -s -X POST -H 'Content-Type: application/json' -d '{"fdcIds":[171688,2646170],"format":"full"}' "$B/foods?api_key=$K" | jq '[.[] | {fdcId, dataType, description, n: (.foodNutrients|length), portions: .foodPortions}]' > usda2_foods_batch.json
          for f in usda2_*; do echo "=====BEGIN $f"; cat "$f"; echo "=====END $f"; done

      - name: Open Food Facts liquids and vitamins
        run: |
          UA='NutritionTrackerProbe/0.1 (personal app; CI probe)'
          F2='code,product_name,product_name_ru,brands,quantity,product_quantity,product_quantity_unit,serving_size,serving_quantity,serving_quantity_unit,nutrition_data_per,nutrition_data_prepared_per,nutriments,categories_tags'
          curl -s -A "$UA" "https://world.openfoodfacts.org/cgi/search.pl?search_terms=%D0%BC%D0%BE%D0%BB%D0%BE%D0%BA%D0%BE&search_simple=1&action=process&json=1&page_size=3&fields=$F2" | jq . > off2_search_milk.json || true
          curl -s -A "$UA" "https://world.openfoodfacts.org/cgi/search.pl?search_terms=corn%20flakes%20vitamins&search_simple=1&action=process&json=1&page_size=2&fields=$F2" | jq . > off2_search_cereal.json || true
          curl -s -A "$UA" "https://world.openfoodfacts.org/api/v2/product/5449000000996?fields=$F2" | jq . > off2_product_cola.json || true
          curl -s -A "$UA" "https://world.openfoodfacts.org/api/v2/product/0000000000000?fields=$F2" | jq . > off2_product_missing.json || true
          for f in off2_*; do echo "=====BEGIN $f"; cat "$f"; echo "=====END $f"; done
