name: edgewind
description: "On the Edge — анонимное место, где можно рассказать свою историю и ответить другому."
publish_to: "none"
version: 1.0.0+1

environment:
  # Debug-сборка, из которой восстановлен исходник, собрана на Dart SDK 3.12.2.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Версии взяты из путей pub-кеша, зашитых в восстановленную сборку,
  # поэтому это ровно то, на чём приложение собиралось.
  image_picker: 1.2.3
  shared_preferences: 2.5.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/quiet-field.png
