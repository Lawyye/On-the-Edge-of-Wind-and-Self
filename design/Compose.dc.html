<!doctype html>
<html>

<x-dc>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #253730; display: flex; flex-direction: column; justify-content: flex-end;">

  <div style="height: 764px; background: #F4F6F1; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; padding: 10px 20px 0;">

    <div style="display: flex; justify-content: center; padding-bottom: 12px;">
      <div style="width: 40px; height: 4px; border-radius: 999px; background: #CDD5CF;"></div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.2px;">Новая запись</h1>
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #E7EBE6; display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#46584F" stroke-width="1.9" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </div>
    </div>

    <p style="margin: 8px 0 0; font-size: 13.5px; color: #78867F;">Имя никто не увидит.</p>

    <div style="margin-top: 22px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.1px; color: #8B998F;">ТЕМА</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px;">
        <div style="height: 34px; padding: 0 14px; border-radius: 999px; background: #F0E2D4; border: 1.5px solid #B8845D; display: flex; align-items: center;">
          <span style="font-size: 13px; font-weight: 600; color: #74543D;">Одиночество</span>
        </div>
        <div style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E0E6E1; display: flex; align-items: center;">
          <span style="font-size: 13px; font-weight: 500; color: #3A4F47;">Просто поговорить</span>
        </div>
        <div style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E0E6E1; display: flex; align-items: center;">
          <span style="font-size: 13px; font-weight: 500; color: #3A4F47;">Тревога</span>
        </div>
        <div style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E0E6E1; display: flex; align-items: center;">
          <span style="font-size: 13px; font-weight: 500; color: #3A4F47;">Отношения</span>
        </div>
        <div style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E0E6E1; display: flex; align-items: center;">
          <span style="font-size: 13px; font-weight: 500; color: #3A4F47;">Семья</span>
        </div>
        <div style="height: 34px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E0E6E1; display: flex; align-items: center;">
          <span style="font-size: 13px; font-weight: 500; color: #8B998F;">Ещё 5</span>
        </div>
      </div>
    </div>

    <div style="margin-top: 24px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.1px; color: #8B998F;">КОРОТКО</span>
      <div style="margin-top: 11px; height: 54px; border-radius: 18px; background: #FFFFFF; border: 1.5px solid #587568; display: flex; align-items: center; padding: 0 17px;">
        <span style="font-family: Literata, Georgia, serif; font-size: 16px; color: #20322D;">Не с кем поговорить в новом городе</span>
      </div>
    </div>

    <div style="margin-top: 18px; flex-grow: 1; display: flex; flex-direction: column;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.1px; color: #8B998F;">ЧТО СЛУЧИЛОСЬ</span>
      <div style="margin-top: 11px; flex-grow: 1; border-radius: 18px; background: #FFFFFF; border: 1px solid #E0E6E1; padding: 15px 17px;">
        <span style="font-size: 15px; line-height: 1.55; color: #9AA79F;">Пиши как есть. Не надо красиво — надо честно.</span>
      </div>
    </div>

    <div style="margin-top: 16px; display: flex; gap: 11px; background: #E9EFE9; border-radius: 16px; padding: 14px 16px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#587568" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;">
        <path d="M12 3l7 4v5c0 4.4-3 8.3-7 9-4-0.7-7-4.6-7-9V7z"></path>
        <path d="M12 10v4"></path>
      </svg>
      <span style="font-size: 13.5px; line-height: 1.5; color: #46604F;">Не пиши адрес, телефон и фамилии — ни свои, ни чужие.</span>
    </div>

    <div style="margin: 16px 0 26px; height: 54px; border-radius: 16px; background: #20322D; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 16px; font-weight: 600; color: #F4F6F1;">Опубликовать</span>
    </div>

  </div>
</div>
</x-dc>
